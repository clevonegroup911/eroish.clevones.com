# Separate server block for eroish.clevones.com on the existing VM.
# Do not merge this into the clevones.com vhost.
# TLS is added by certbot after the A record exists.

upstream eroish_clevones_com {
    server 127.0.0.1:3001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name eroish.clevones.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eroish.clevones.com;

    # certbot will replace these paths
    ssl_certificate     /etc/letsencrypt/live/eroish.clevones.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eroish.clevones.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://eroish_clevones_com;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required so the app can set Secure on the session cookie.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
